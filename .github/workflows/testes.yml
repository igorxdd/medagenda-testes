name: Testes MedAgenda

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEB_BASE_URL: http://localhost:8080
      API_BASE_URL: http://localhost:3000/api
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias dos testes
        run: npm ci
      - name: Preparar diretorios de relatorios
        run: npm run prepare:reports
      - name: Verificar tipos
        run: npm run typecheck
      - name: Verificar integridade da aplicacao original
        run: npm run verify:source
      - name: Instalar navegadores
        run: npx playwright install --with-deps chrome firefox
      - name: Subir aplicacao original
        run: docker compose up --build -d
      - name: Aguardar API e seed inicial
        run: npm run wait:api
      - name: Restaurar dados antes da suite API
        run: docker compose exec -T api npm run seed
      - name: API Postman e Newman
        id: api
        run: npm run test:api
      - name: Restaurar dados antes da interface
        if: ${{ !cancelled() && steps.api.outcome != 'skipped' }}
        run: docker compose exec -T api npm run seed
      - name: Interface Playwright
        id: interface
        if: ${{ !cancelled() && steps.api.outcome != 'skipped' }}
        run: npm run test:interface
      - name: Restaurar dados antes do BDD
        if: ${{ !cancelled() && steps.interface.outcome != 'skipped' }}
        run: docker compose exec -T api npm run seed
      - name: BDD Cucumber e TypeScript
        if: ${{ !cancelled() && steps.interface.outcome != 'skipped' }}
        run: npm run test:bdd
      - name: Guardar logs da aplicacao
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/docker-compose.log 2>&1
      - name: Publicar relatorios e evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-smoke
          path: reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Encerrar ambiente descartavel de CI
        if: always()
        run: docker compose down -v

  acessibilidade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEB_BASE_URL: http://localhost:8080
      API_BASE_URL: http://localhost:3000/api
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome firefox
      - run: docker compose up --build -d
      - run: npm run wait:api
      - run: docker compose exec -T api npm run seed
      - name: Auditar telas do RNF04
        run: npm run test:a11y
      - name: Guardar logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/docker-compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-acessibilidade
          path: reports/
          retention-days: 14
      - if: always()
        run: docker compose down -v

  desempenho:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose up --build -d
      - run: npm run wait:api
      - run: docker compose exec -T api npm run seed
      - name: RNF03 com 50 usuarios por um minuto
        run: |
          mkdir -p reports/k6
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work grafana/k6:1.0.0 run --summary-export=reports/k6/resumo.json tests/desempenho-k6/rnf03.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-desempenho
          path: reports/k6/
      - if: always()
        run: docker compose down -v

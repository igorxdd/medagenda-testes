name: MedAgenda

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-ambiente:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração do Docker Compose
        run: docker compose config --quiet
      - name: Subir o MedAgenda
        run: docker compose up --build -d
      - name: Aguardar a API
        run: |
          for tentativa in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:3000/api/saude; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Guardar logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/docker-compose.log 2>&1
      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-medagenda
          path: reports/
          retention-days: 14
      - name: Encerrar ambiente de CI
        if: always()
        run: docker compose down -v
